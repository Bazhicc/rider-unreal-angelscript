name: Build Rider Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag $RELEASE_TAG must match pluginVersion=$version"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: language-server/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: bash gradlew buildPlugin check verifyPluginStructure --console=plain
        shell: bash
      - name: Verify Rider binary compatibility
        if: runner.os == 'Linux'
        run: bash gradlew verifyPlugin --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
      - uses: actions/upload-artifact@v4
        with:
          name: UnrealAngelscript-Rider-${{ matrix.os }}
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UnrealAngelscript-Rider-windows-latest
          path: release
      - name: Publish plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '\r')"
          asset="release/UnrealAngelscript-$version.zip"
          test -f "$asset"
          args=(--verify-tag --latest --title "Unreal AngelScript $version")
          notes="docs/releases/$version.md"
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" "$asset" "${args[@]}"
